<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <rect width="480" height="270" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="240" y="22" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#0a6b65" letter-spacing="0.08em">MULTIMODAL FINE-TUNING PIPELINE</text>

  <!-- Input: Text -->
  <rect x="16" y="38" width="72" height="34" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="52" y="52" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6b7280">Text</text>
  <text x="52" y="63" text-anchor="middle" font-family="mono, monospace" font-size="7.5" fill="#374151">"tokenized..."</text>

  <!-- Input: Image -->
  <rect x="16" y="82" width="72" height="34" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect x="24" y="88" width="22" height="16" rx="2" fill="#e0f2f1" stroke="#0a6b65" stroke-width="0.8"/>
  <circle cx="30" cy="93" r="3" fill="#b2dfdb"/>
  <text x="62" y="97" text-anchor="middle" font-family="system-ui" font-size="8" fill="#374151">Image</text>
  <text x="62" y="108" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">ViT patches</text>

  <!-- Input: Audio -->
  <rect x="16" y="126" width="72" height="34" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1.2"/>
  <!-- waveform -->
  <path d="M24 143 Q28 134 32 143 Q36 152 40 143 Q44 134 48 143" fill="none" stroke="#0a6b65" stroke-width="1.5"/>
  <text x="62" y="140" text-anchor="middle" font-family="system-ui" font-size="8" fill="#374151">Audio</text>
  <text x="62" y="151" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">mel-spec</text>

  <!-- Arrows to encoders -->
  <line x1="90" y1="55" x2="116" y2="78" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="90" y1="99" x2="116" y2="99" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="90" y1="143" x2="116" y2="120" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr2)"/>

  <!-- Encoders box -->
  <rect x="118" y="52" width="80" height="116" rx="5" fill="white" stroke="#374151" stroke-width="1.5"/>
  <text x="158" y="68" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="#1e293b">Encoders</text>
  <rect x="126" y="74" width="64" height="22" rx="3" fill="#f0fdf4" stroke="#0a6b65" stroke-width="1"/>
  <text x="158" y="89" text-anchor="middle" font-family="system-ui" font-size="8" fill="#0a6b65" font-weight="600">BERT</text>
  <rect x="126" y="102" width="64" height="22" rx="3" fill="#f0fdf4" stroke="#0a6b65" stroke-width="1"/>
  <text x="158" y="117" text-anchor="middle" font-family="system-ui" font-size="8" fill="#0a6b65" font-weight="600">ViT</text>
  <rect x="126" y="130" width="64" height="22" rx="3" fill="#f0fdf4" stroke="#0a6b65" stroke-width="1"/>
  <text x="158" y="145" text-anchor="middle" font-family="system-ui" font-size="8" fill="#0a6b65" font-weight="600">Whisper</text>

  <!-- Arrow to fusion -->
  <line x1="200" y1="110" x2="224" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Fusion -->
  <rect x="226" y="78" width="64" height="64" rx="5" fill="white" stroke="#374151" stroke-width="1.5"/>
  <text x="258" y="98" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="#1e293b">Fusion</text>
  <text x="258" y="110" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">cross-attn</text>
  <!-- cross-attention icon -->
  <line x1="238" y1="120" x2="278" y2="120" stroke="#0a6b65" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="248" cy="120" r="3" fill="#0a6b65"/>
  <circle cx="258" cy="120" r="3" fill="#b2dfdb" stroke="#0a6b65" stroke-width="1"/>
  <circle cx="268" cy="120" r="3" fill="#0a6b65"/>
  <line x1="248" y1="117" x2="258" y2="123" stroke="#374151" stroke-width="0.8"/>
  <line x1="268" y1="117" x2="258" y2="123" stroke="#374151" stroke-width="0.8"/>

  <!-- Arrow to fine-tune -->
  <line x1="292" y1="110" x2="316" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Fine-tune -->
  <rect x="318" y="62" width="80" height="96" rx="5" fill="white" stroke="#374151" stroke-width="1.5"/>
  <text x="358" y="78" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="#1e293b">Fine-Tune</text>
  <!-- gradient descent arrows -->
  <text x="358" y="92" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">LoRA / full</text>
  <path d="M330 102 Q358 94 386 102" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="358" y="117" text-anchor="middle" font-family="system-ui" font-size="7" fill="#ef4444">∇ loss</text>
  <!-- loss curve -->
  <path d="M326 134 Q336 126 346 128 Q356 130 366 124 Q376 118 386 116" fill="none" stroke="#0a6b65" stroke-width="1.5"/>
  <text x="358" y="150" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">converging</text>

  <!-- Output -->
  <rect x="410" y="82" width="62" height="56" rx="5" fill="#f0fdf4" stroke="#0a6b65" stroke-width="1.5"/>
  <text x="441" y="100" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="#166534">Output</text>
  <text x="441" y="114" text-anchor="middle" font-family="system-ui" font-size="7" fill="#374151">classify</text>
  <text x="441" y="125" text-anchor="middle" font-family="system-ui" font-size="7" fill="#374151">generate</text>
  <text x="441" y="132" text-anchor="middle" font-family="system-ui" font-size="7" fill="#374151">retrieve</text>
  <line x1="400" y1="110" x2="409" y2="110" stroke="#0a6b65" stroke-width="1.5" marker-end="url(#arrteal2)"/>

  <!-- Bottom label -->
  <text x="240" y="210" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6b7280">HuggingFace · PyTorch · BERT · ViT · Whisper</text>

  <defs>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrteal2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#0a6b65"/>
    </marker>
  </defs>
</svg>
