<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168" width="240" height="168">
  <rect width="240" height="168" fill="#f8f9fa"/>
  <!-- Transistor cross-section layers -->
  <rect x="20" y="20" width="200" height="28" rx="2" fill="#d1d5db"/>
  <text x="120" y="38" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6b7280">Gate Oxide</text>
  <!-- Source / Drain / Gate -->
  <rect x="20" y="48" width="60" height="22" rx="2" fill="#374151"/>
  <text x="50" y="62" text-anchor="middle" font-family="system-ui" font-size="9" fill="white">Source</text>
  <rect x="90" y="48" width="60" height="22" rx="2" fill="#1e293b"/>
  <text x="120" y="62" text-anchor="middle" font-family="system-ui" font-size="9" fill="white">Gate</text>
  <rect x="160" y="48" width="60" height="22" rx="2" fill="#374151"/>
  <text x="190" y="62" text-anchor="middle" font-family="system-ui" font-size="9" fill="white">Drain</text>
  <!-- Substrate -->
  <rect x="20" y="70" width="200" height="30" rx="2" fill="#e5e7eb"/>
  <text x="120" y="89" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6b7280">Silicon Substrate</text>
  <!-- Heat map gradient -->
  <defs>
    <linearGradient id="heatGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect x="20" y="100" width="200" height="14" rx="2" fill="url(#heatGrad)"/>
  <text x="20" y="126" font-family="system-ui" font-size="8" fill="#6b7280">Low T</text>
  <text x="190" y="126" font-family="system-ui" font-size="8" fill="#6b7280">High T</text>
  <!-- Neural operator label -->
  <rect x="60" y="134" width="120" height="22" rx="3" fill="#1e293b"/>
  <text x="120" y="148" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="600" fill="white">Neural Operator</text>
</svg>
