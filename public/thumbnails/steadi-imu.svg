<svg xmlns="http://www.w3.org/2000/svg" width="240" height="168" viewBox="0 0 240 168">
  <rect width="240" height="168" fill="#f8f9fa"/>
  <!-- Floor -->
  <line x1="20" y1="148" x2="220" y2="148" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- Balance figure - standing on one leg -->
  <circle cx="90" cy="30" r="11" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Body -->
  <line x1="90" y1="41" x2="90" y2="88" stroke="#374151" stroke-width="2"/>
  <!-- Arms out for balance -->
  <line x1="90" y1="58" x2="62" y2="72" stroke="#374151" stroke-width="2"/>
  <line x1="90" y1="58" x2="118" y2="66" stroke="#374151" stroke-width="2"/>
  <!-- One leg standing, one raised -->
  <line x1="90" y1="88" x2="82" y2="120" stroke="#374151" stroke-width="2"/>
  <line x1="82" y1="120" x2="76" y2="148" stroke="#374151" stroke-width="2"/>
  <!-- Raised leg -->
  <line x1="90" y1="88" x2="104" y2="108" stroke="#374151" stroke-width="2"/>
  <line x1="104" y1="108" x2="116" y2="100" stroke="#374151" stroke-width="2"/>
  <!-- IMU at waist/sacrum -->
  <rect x="80" y="84" width="20" height="12" rx="2" fill="#0a6b65"/>
  <text x="90" y="93" text-anchor="middle" font-family="system-ui" font-size="6.5" fill="white" font-weight="700">IMU</text>
  <!-- Sway indicator -->
  <path d="M76 148 Q90 136 104 148" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="90" y="162" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">sway path</text>
  <!-- STEADI metrics panel -->
  <rect x="135" y="18" width="90" height="120" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="180" y="34" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="#1e293b">STEADI</text>
  <text x="180" y="46" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">Fall Risk Assessment</text>
  <!-- Score bars -->
  <text x="143" y="62" font-family="system-ui" font-size="7" fill="#6b7280">Static Balance</text>
  <rect x="143" y="65" width="74" height="7" rx="2" fill="#f3f4f6"/>
  <rect x="143" y="65" width="52" height="7" rx="2" fill="#0a6b65"/>
  <text x="143" y="84" font-family="system-ui" font-size="7" fill="#6b7280">Dynamic Stability</text>
  <rect x="143" y="87" width="74" height="7" rx="2" fill="#f3f4f6"/>
  <rect x="143" y="87" width="62" height="7" rx="2" fill="#374151"/>
  <text x="143" y="106" font-family="system-ui" font-size="7" fill="#6b7280">Tandem Walk</text>
  <rect x="143" y="109" width="74" height="7" rx="2" fill="#f3f4f6"/>
  <rect x="143" y="109" width="40" height="7" rx="2" fill="#64748b"/>
  <!-- Risk label -->
  <rect x="148" y="122" width="64" height="10" rx="2" fill="#fef3c7"/>
  <text x="180" y="130" text-anchor="middle" font-family="system-ui" font-size="7" fill="#92400e">Moderate Risk</text>
</svg>
