<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168" width="240" height="168">
  <rect width="240" height="168" fill="#f8f9fa"/>
  <!-- Floor line -->
  <line x1="10" y1="140" x2="230" y2="140" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Walking stick figure -->
  <!-- Head -->
  <circle cx="80" cy="38" r="10" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Body -->
  <line x1="80" y1="48" x2="80" y2="90" stroke="#374151" stroke-width="2"/>
  <!-- Arms -->
  <line x1="80" y1="62" x2="58" y2="80" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="62" x2="102" y2="72" stroke="#374151" stroke-width="2"/>
  <!-- Legs walking -->
  <line x1="80" y1="90" x2="62" y2="120" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="90" x2="96" y2="118" stroke="#374151" stroke-width="2"/>
  <line x1="62" y1="120" x2="52" y2="140" stroke="#374151" stroke-width="2"/>
  <line x1="96" y1="118" x2="106" y2="138" stroke="#374151" stroke-width="2"/>
  <!-- IMU sensor marker on waist -->
  <rect x="72" y="84" width="16" height="10" rx="2" fill="#0a6b65"/>
  <text x="80" y="92" text-anchor="middle" font-family="system-ui" font-size="6" fill="white" font-weight="700">IMU</text>
  <!-- CoM trajectory curve -->
  <path d="M30 95 Q60 78 90 90 Q120 102 150 88 Q180 74 210 86" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Camera icon -->
  <rect x="170" y="30" width="50" height="36" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="195" cy="48" r="10" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="195" cy="48" r="5" fill="#9ca3af"/>
  <rect x="215" y="37" width="8" height="6" rx="1" fill="#9ca3af"/>
  <!-- Legend -->
  <line x1="20" y1="155" x2="36" y2="155" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="40" y="158" font-family="system-ui" font-size="8" fill="#6b7280">CoM path</text>
  <rect x="110" y="150" width="8" height="8" rx="1" fill="#0a6b65"/>
  <text x="122" y="158" font-family="system-ui" font-size="8" fill="#6b7280">IMU</text>
  <rect x="170" y="150" width="10" height="8" rx="1" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="184" y="158" font-family="system-ui" font-size="8" fill="#6b7280">Camera</text>
</svg>
