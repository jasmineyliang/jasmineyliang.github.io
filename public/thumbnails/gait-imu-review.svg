<svg xmlns="http://www.w3.org/2000/svg" width="240" height="168" viewBox="0 0 240 168">
  <rect width="240" height="168" fill="#f8f9fa"/>
  <!-- Simplified body silhouette -->
  <!-- Head -->
  <circle cx="80" cy="28" r="12" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- Torso -->
  <rect x="62" y="40" width="36" height="44" rx="4" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- Upper legs -->
  <rect x="62" y="84" width="16" height="30" rx="3" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="82" y="84" width="16" height="30" rx="3" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- Lower legs -->
  <rect x="62" y="114" width="16" height="26" rx="3" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="82" y="114" width="16" height="26" rx="3" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- IMU sensors at standard placement -->
  <!-- Head -->
  <rect x="88" y="22" width="16" height="11" rx="2" fill="#1e293b"/>
  <text x="96" y="30" text-anchor="middle" font-family="system-ui" font-size="6" fill="white" font-weight="700">IMU</text>
  <line x1="88" y1="27" x2="92" y2="27" stroke="#1e293b" stroke-width="1"/>
  <!-- Sternum -->
  <rect x="102" y="55" width="16" height="11" rx="2" fill="#0a6b65"/>
  <text x="110" y="63" text-anchor="middle" font-family="system-ui" font-size="6" fill="white" font-weight="700">IMU</text>
  <line x1="98" y1="60" x2="102" y2="60" stroke="#0a6b65" stroke-width="1"/>
  <!-- Sacrum -->
  <rect x="102" y="80" width="16" height="11" rx="2" fill="#374151"/>
  <text x="110" y="88" text-anchor="middle" font-family="system-ui" font-size="6" fill="white" font-weight="700">IMU</text>
  <line x1="98" y1="85" x2="102" y2="85" stroke="#374151" stroke-width="1"/>
  <!-- Ankle -->
  <rect x="102" y="128" width="16" height="11" rx="2" fill="#64748b"/>
  <text x="110" y="136" text-anchor="middle" font-family="system-ui" font-size="6" fill="white" font-weight="700">IMU</text>
  <line x1="98" y1="133" x2="102" y2="133" stroke="#64748b" stroke-width="1"/>
  <!-- Sensor fusion diagram -->
  <rect x="145" y="20" width="82" height="130" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="186" y="34" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="#1e293b">Sensor Fusion</text>
  <!-- Signal lines -->
  <path d="M148 50 Q155 44 162 50 Q169 56 176 50 Q183 44 190 50" fill="none" stroke="#0a6b65" stroke-width="1.5"/>
  <path d="M148 68 Q155 62 162 68 Q169 74 176 68 Q183 62 190 68" fill="none" stroke="#374151" stroke-width="1.5"/>
  <path d="M148 86 Q155 80 162 86 Q169 92 176 86 Q183 80 190 86" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="186" y="104" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">Accel · Gyro · Mag</text>
  <!-- Output metrics -->
  <rect x="150" y="110" width="68" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="184" y="122" text-anchor="middle" font-family="system-ui" font-size="7" fill="#166534">Gait Parameters</text>
  <text x="184" y="135" text-anchor="middle" font-family="system-ui" font-size="7" fill="#166534">Balance · Stability</text>
</svg>
