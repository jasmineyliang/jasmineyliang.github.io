<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <rect width="480" height="270" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="240" y="22" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#0a6b65" letter-spacing="0.08em">LANGCHAIN MULTIMODAL AGENT</text>

  <!-- User input -->
  <rect x="16" y="108" width="72" height="40" rx="5" fill="white" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="52" y="125" text-anchor="middle" font-family="system-ui" font-size="8" fill="#374151" font-weight="600">User</text>
  <!-- speech bubble -->
  <rect x="24" y="130" width="40" height="12" rx="3" fill="#f0fdf4" stroke="#0a6b65" stroke-width="0.8"/>
  <text x="44" y="139" text-anchor="middle" font-family="system-ui" font-size="6.5" fill="#0a6b65">"Describe..."</text>

  <!-- Arrow to agent -->
  <line x1="90" y1="128" x2="150" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Central Agent box -->
  <rect x="152" y="78" width="100" height="100" rx="7" fill="white" stroke="#374151" stroke-width="2"/>
  <text x="202" y="102" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#1e293b">Agent</text>
  <text x="202" y="114" text-anchor="middle" font-family="system-ui" font-size="7.5" fill="#6b7280">LangChain</text>
  <!-- chain icon -->
  <circle cx="186" cy="130" r="8" fill="none" stroke="#0a6b65" stroke-width="1.5"/>
  <circle cx="202" cy="130" r="8" fill="none" stroke="#0a6b65" stroke-width="1.5"/>
  <circle cx="218" cy="130" r="8" fill="none" stroke="#0a6b65" stroke-width="1.5"/>
  <line x1="194" y1="130" x2="194" y2="130" stroke="#0a6b65" stroke-width="2"/>
  <line x1="210" y1="130" x2="210" y2="130" stroke="#0a6b65" stroke-width="2"/>
  <text x="202" y="155" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">plan · act · observe</text>
  <text x="202" y="165" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">memory buffer</text>

  <!-- Tool: Speech-to-Text (top) -->
  <rect x="296" y="38" width="96" height="44" rx="5" fill="white" stroke="#e5e7eb" stroke-width="1.2"/>
  <path d="M306 56 Q310 46 314 56 Q318 66 322 56" fill="none" stroke="#0a6b65" stroke-width="1.5"/>
  <text x="366" y="54" text-anchor="middle" font-family="system-ui" font-size="8" fill="#374151" font-weight="600">Whisper STT</text>
  <text x="366" y="66" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">speech → text</text>
  <text x="366" y="76" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">OpenAI API</text>

  <!-- Tool: Vision (middle) -->
  <rect x="296" y="108" width="96" height="44" rx="5" fill="white" stroke="#e5e7eb" stroke-width="1.2"/>
  <circle cx="314" cy="130" r="10" fill="none" stroke="#374151" stroke-width="1.2"/>
  <circle cx="314" cy="130" r="4" fill="#0a6b65"/>
  <text x="366" y="122" text-anchor="middle" font-family="system-ui" font-size="8" fill="#374151" font-weight="600">Vision Chain</text>
  <text x="366" y="134" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">image captioning</text>
  <text x="366" y="144" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">GPT-4V</text>

  <!-- Tool: Text LLM (bottom) -->
  <rect x="296" y="178" width="96" height="44" rx="5" fill="white" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect x="304" y="188" width="30" height="6" rx="1" fill="#0a6b65" opacity="0.8"/>
  <rect x="304" y="198" width="22" height="6" rx="1" fill="#0a6b65" opacity="0.5"/>
  <rect x="304" y="208" width="26" height="6" rx="1" fill="#0a6b65" opacity="0.3"/>
  <text x="366" y="192" text-anchor="middle" font-family="system-ui" font-size="8" fill="#374151" font-weight="600">Text LLM</text>
  <text x="366" y="204" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">summarize</text>
  <text x="366" y="214" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6b7280">chat engine</text>

  <!-- Arrows from agent to tools -->
  <line x1="253" y1="102" x2="294" y2="62" stroke="#0a6b65" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrteal3)"/>
  <line x1="254" y1="128" x2="294" y2="130" stroke="#0a6b65" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrteal3)"/>
  <line x1="253" y1="155" x2="294" y2="196" stroke="#0a6b65" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrteal3)"/>

  <!-- Output -->
  <rect x="406" y="108" width="62" height="44" rx="5" fill="#f0fdf4" stroke="#0a6b65" stroke-width="1.5"/>
  <text x="437" y="126" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="#166534">Response</text>
  <text x="437" y="138" text-anchor="middle" font-family="system-ui" font-size="7" fill="#374151">multimodal</text>
  <text x="437" y="148" text-anchor="middle" font-family="system-ui" font-size="7" fill="#374151">grounded</text>
  <line x1="394" y1="130" x2="404" y2="130" stroke="#0a6b65" stroke-width="1.5" marker-end="url(#arrteal3)"/>

  <defs>
    <marker id="arr3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrteal3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#0a6b65"/>
    </marker>
  </defs>
</svg>
